<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handwritten Digit Recognizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Prevent the browser from scrolling when touching the canvas on mobile */
        #drawingCanvas {
            touch-action: none;
        }
        
        /* Add a subtle dot grid pattern to the background for a modern look */
        body {
            background-color: #f3f4f6;
            background-image: radial-gradient(#d1d5db 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center font-sans p-4">

    <!-- Main App Card -->
    <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-8 max-w-md w-full flex flex-col items-center transform transition-all hover:shadow-2xl">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold text-gray-800 tracking-tight">Draw & Predict</h1>
            <p class="text-gray-500 mt-2 text-sm">Draw a number (0-9) inside the box below.</p>
        </div>

        <!-- Canvas Container -->
        <!-- 280x280 matches the Tkinter app size and scales nicely to MNIST's 28x28 -->
        <div class="bg-white p-2 rounded-xl shadow-inner border-2 border-gray-200 bg-gray-50">
            <canvas id="drawingCanvas" width="280" height="280" 
                    class="bg-white rounded-lg cursor-crosshair shadow-sm border border-gray-100">
            </canvas>
        </div>

        <!-- Action Buttons -->
        <div class="flex gap-4 w-full mt-8 justify-center">
            <button id="predictBtn" 
                    class="flex-1 bg-green-500 hover:bg-green-600 text-white font-semibold py-3 px-4 rounded-xl shadow-md hover:shadow-lg transition duration-200 transform hover:-translate-y-0.5 active:translate-y-0">
                Predict Digit
            </button>
            <button id="clearBtn" 
                    class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-3 px-4 rounded-xl shadow-sm hover:shadow transition duration-200 transform hover:-translate-y-0.5 active:translate-y-0">
                Clear Canvas
            </button>
        </div>

        <!-- Prediction Result Area -->
        <div class="mt-8 mb-2 h-16 flex items-center justify-center w-full bg-blue-50 rounded-xl border border-blue-100">
            <p id="resultText" class="text-lg font-medium text-gray-600">
                Ready for input...
            </p>
        </div>
        
        <p class="text-xs text-gray-400 mt-4 text-center">
            * Note: This is a UI demo. In a full app, this canvas would send image data to your PyTorch backend.
        </p>

    </div>

    <script>
        // Setup Canvas and Context
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');
        const clearBtn = document.getElementById('clearBtn');
        const predictBtn = document.getElementById('predictBtn');
        const resultText = document.getElementById('resultText');

        // Configure the drawing brush (thick and rounded, mimicking the Tkinter brush)
        ctx.lineWidth = 15;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#000000'; // Black ink

        // Fill canvas with solid white background initially (Crucial for image processing)
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        let isDrawing = false;

        // --- Drawing Logic (Mouse & Touch) ---

        // Get exact coordinates within the canvas
        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            // Handle both touch and mouse events
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startDrawing(e) {
            isDrawing = true;
            const coords = getCoordinates(e);
            ctx.beginPath();
            ctx.moveTo(coords.x, coords.y);
            // Draw a single dot if it's just a click/tap
            ctx.lineTo(coords.x, coords.y);
            ctx.stroke();
            e.preventDefault(); // Prevent scrolling on touch
        }

        function draw(e) {
            if (!isDrawing) return;
            const coords = getCoordinates(e);
            ctx.lineTo(coords.x, coords.y);
            ctx.stroke();
            e.preventDefault();
        }

        function stopDrawing() {
            if (isDrawing) {
                ctx.closePath();
                isDrawing = false;
            }
        }

        // Mouse Event Listeners
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        // Touch Event Listeners (for mobile/tablets)
        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);

        // --- Button Logic ---

        // Clear Canvas
        clearBtn.addEventListener('click', () => {
            // Fill with solid white instead of clearing to transparent
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            // Reset the text
            resultText.innerHTML = 'Ready for input...';
            resultText.className = "text-lg font-medium text-gray-600";
        });

        // Real Prediction via Backend API
        predictBtn.addEventListener('click', async () => {
            // Check if canvas is entirely blank
            const blank = document.createElement('canvas');
            blank.width = canvas.width;
            blank.height = canvas.height;
            const blankCtx = blank.getContext('2d');
            blankCtx.fillStyle = '#ffffff';
            blankCtx.fillRect(0, 0, blank.width, blank.height);
            
            if (canvas.toDataURL() === blank.toDataURL()) {
                resultText.innerHTML = 'Please draw a number first!';
                resultText.className = "text-lg font-medium text-orange-500";
                return;
            }

            // Show loading state
            resultText.innerHTML = 'Predicting...';
            resultText.className = "text-lg font-medium text-gray-500 animate-pulse";
            
            try {
                // Get base64 image data from the HTML canvas
                const imageData = canvas.toDataURL('image/png');
                
                // Send drawing to the Python Flask backend we created
                const response = await fetch('http://127.0.0.1:5000/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: imageData })
                });
                
                if (!response.ok) throw new Error('Server error');
                
                const data = await response.json();
                
                // Display the REAL prediction from PyTorch
                resultText.innerHTML = `Prediction: <span class="text-3xl ml-2 font-bold text-blue-600">${data.prediction}</span>`;
                resultText.className = "text-lg font-medium text-gray-800";
            } catch (error) {
                console.error(error);
                resultText.innerHTML = 'Error connecting to backend.';
                resultText.className = "text-lg font-medium text-red-500";
            }
        });
    </script>
</body>
</html>
